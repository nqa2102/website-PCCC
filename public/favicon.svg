<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rounded Squircle Background (Matte Dark) -->
  <rect width="128" height="128" rx="30" fill="#111111" />
  <rect x="1" y="1" width="126" height="126" rx="29" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Subtle Glow -->
  <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#111111" stop-opacity="0" />
  </radialGradient>
  <circle cx="64" cy="64" r="50" fill="url(#fav-glow)" />

  <!-- Gradients for Apex Mark -->
  <defs>
    <linearGradient id="gold-left" x1="64" y1="20" x2="28" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7E6BD" />
      <stop offset="40%" stop-color="#DFBA73" />
      <stop offset="100%" stop-color="#AA8237" />
    </linearGradient>
    <linearGradient id="gold-right" x1="64" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#A88035" />
      <stop offset="100%" stop-color="#6C4D18" />
    </linearGradient>
  </defs>

  <!-- Left Wing (Light) -->
  <polygon points="64,22 22,98 44,79 64,52" fill="url(#gold-left)" />
  
  <!-- Right Wing (Dark) -->
  <polygon points="64,22 64,52 84,79 106,98" fill="url(#gold-right)" />

  <!-- Center Ridge Highlight -->
  <line x1="64" y1="22" x2="64" y2="52" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" />
</svg>
